name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler l'APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PversionCode=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk smbsynchdroid-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: smbsynchdroid-${{ github.run_number }}
          path: smbsynchdroid-${{ github.run_number }}.apk

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: smbsynchdroid ${{ github.run_number }}
          files: smbsynchdroid-${{ github.run_number }}.apk
          make_latest: true
